<!DOCTYPE html>
<html lang="uk"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Мій профіль</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="row g-4">

        <div class="col-lg-4">

            <div class="card p-4">

                <h2 class="fw-bold mb-4">
                    Мій профіль
                </h2>

                <p>
                    <strong>Ім'я користувача:</strong>
                    <span th:text="${user.userName}"></span>
                </p>

                <p>
                    <strong>Електронна пошта:</strong>
                    <span th:text="${user.email}"></span>
                </p>

                <a th:href="@{/profile/edit}"
                   class="btn btn-dark mt-3">

                    Редагувати профіль

                </a>

            </div>

        </div>

        <div class="col-lg-8">

            <div th:if="${overdueWarning}"
                 class="alert alert-warning"
                 th:text="${overdueWarning}">
            </div>

            <div th:if="${unpaidFinesWarning}"
                 class="alert alert-danger"
                 th:text="${unpaidFinesWarning}">
            </div>

            <div class="card p-4 mb-4">

                <h3 class="mb-4">
                    Взяті книги
                </h3>

                <div th:if="${noIssuedBooksMessage}"
                     class="alert alert-secondary"
                     th:text="${noIssuedBooksMessage}">
                </div>

                <table class="table align-middle"
                       th:if="${issuedBooks != null and !issuedBooks.isEmpty()}">

                    <thead>
                    <tr>
                        <th>ID примірника</th>
                        <th>Назва</th>
                        <th>Автор</th>
                        <th>Термін повернення</th>
                        <th>Статус</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="book : ${issuedBooks}">

                        <td th:text="${book.copyID}"></td>

                        <td th:text="${book.title}"></td>

                        <td th:text="${book.author}"></td>

                        <td th:text="${book.dueDate}"></td>

                        <td>

                            <span th:if="${book.overdue}"
                                  class="badge bg-danger">
                                Прострочено
                            </span>

                            <span th:if="${!book.overdue}"
                                  class="badge bg-success">
                                Активна
                            </span>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <div class="card p-4">

                <h3 class="mb-4">
                    Штрафи
                </h3>

                <div th:if="${fines == null or fines.isEmpty()}"
                     class="alert alert-secondary">

                    Немає штрафів

                </div>

                <table class="table align-middle"
                       th:if="${fines != null and !fines.isEmpty()}">

                    <thead>
                    <tr>
                        <th>Причина</th>
                        <th>Сума</th>
                        <th>Статус</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="fine : ${fines}">

                        <td>
                            <span th:if="${fine.reason.name() == 'DAMAGE'}">Пошкодження книги</span>
                            <span th:if="${fine.reason.name() == 'OVERDUE'}">Прострочення терміну</span>
                            <span th:if="${fine.reason.name() != 'DAMAGE' && fine.reason.name() != 'OVERDUE'}"
                                  th:text="${fine.reason}">
                            </span>
                        </td>

                        <td th:text="${fine.amount}"></td>

                        <td>

                            <span th:if="${fine.paid}"
                                  class="badge bg-success">
                                Оплачено
                            </span>

                            <span th:if="${!fine.paid}"
                                  class="badge bg-danger">
                                Неоплачено
                            </span>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
