<!DOCTYPE html>
<html lang="uk"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Керування запитами</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1 class="fw-bold">
                Керування запитами
            </h1>

            <p class="text-muted mb-0">
                Активні бібліотечні запити
            </p>

        </div>

    </div>

    <div class="card p-4">

        <div th:if="${requests == null or requests.isEmpty()}"
             class="alert alert-secondary">

            Немає активних запитів

        </div>

        <table class="table table-hover align-middle"
               th:if="${requests != null and !requests.isEmpty()}">

            <thead>
            <tr>
                <th>ID запиту</th>
                <th>Користувач</th>
                <th>Книга</th>
                <th>Статус</th>
                <th>Заброньована копія</th>
                <th>Створено</th>
                <th>Дії</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="request : ${requests}">

                <td th:text="${request.requestID}"></td>

                <td>
                    <a th:href="@{/admin/user/{id}(id=${request.userID})}"
                       th:text="${request.userID}"
                       class="text-decoration-none">
                    </a>
                </td>

                <td>
                    <a th:href="@{/books/{id}(id=${request.bookID})}"
                       th:text="${request.bookID}"
                       class="text-decoration-none">
                    </a>
                </td>

                <td>

                    <span class="badge bg-warning text-dark"
                          th:if="${request.status.name() == 'PENDING'}">

                        Очікується

                    </span>

                    <span class="badge bg-primary"
                          th:if="${request.status.name() == 'AWAITING_ISSUANCE'}">

                        Очікує видачі

                    </span>

                    <span class="badge bg-success"
                          th:if="${request.status.name() == 'APPROVED'}">

                        Схвалено

                    </span>

                    <span class="badge bg-danger"
                          th:if="${request.status.name() == 'REJECTED'}">

                        Відхилено

                    </span>

                </td>

                <td>

                    <span class="text-decoration-none"
                          th:if="${request.reservedCopyID == null}">
                        --
                    </span>
                    <span class="text-decoration-none"
                          th:if="${request.reservedCopyID != null}"
                          th:text="${request.reservedCopyID}">
                    </span>

                </td>

                <td th:text="${request.createdAt}"></td>

                <td>

                    <div class="d-flex gap-2 flex-wrap">

                        <form th:action="@{/admin/request/{id}/approve(id=${request.requestID})}"
                              method="post">

                            <button type="submit"
                                    class="btn btn-success btn-sm">

                                Схвалити

                            </button>

                        </form>

                        <form th:action="@{/admin/request/{id}/reject(id=${request.requestID})}"
                              method="post">

                            <button type="submit"
                                    class="btn btn-danger btn-sm">

                                Відхилити

                            </button>

                        </form>

                        <form th:action="@{/admin/issue/{id}(id=${request.requestID})}"
                              method="post">

                            <button type="submit"
                                    class="btn btn-dark btn-sm">

                                Видати

                            </button>

                        </form>

                    </div>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
