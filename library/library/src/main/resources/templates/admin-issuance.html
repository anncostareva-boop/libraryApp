<!DOCTYPE html>
<html lang="uk"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Видачі</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">

    <div class="card p-4 shadow-sm border-0 rounded-3">

        <h1 class="mb-4 fw-bold">
            Активні видачі
        </h1>

        <div th:if="${#lists.isEmpty(issuances)}"
             class="alert alert-secondary mb-0">
            Активних видач немає
        </div>

        <table th:if="${!#lists.isEmpty(issuances)}"
               class="table table-hover align-middle mb-0">

            <thead>
            <tr>
                <th>ID видачі</th>
                <th>ID Користувача</th>
                <th>ID Примірника</th>
                <th>Дата видачі</th>
                <th>Повернути до</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="issuance : ${issuances}">

                <td th:text="${issuance.issuanceID}"></td>

                <td>
                    <a th:href="@{/admin/user/{id}(id=${issuance.userID})}"
                       th:text="${issuance.userID}"
                       class="text-decoration-none fw-semibold text-primary">
                    </a>
                </td>

                <td>
                    <a th:href="@{/books/{id}(id=${issuance.bookID})}"
                       th:text="${issuance.copyID}"
                       class="text-decoration-none fw-semibold text-primary">
                    </a>
                </td>

                <td th:text="${issuance.issuanceDate}"></td>

                <td th:text="${issuance.dueDate}"></td>

            </tr>
            </tbody>

        </table>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
