<!DOCTYPE html>
<html lang="uk"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Користувачі</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">

    <div class="card shadow-sm border-0 p-4">

        <h1 class="mb-4 fw-bold">
            Користувачі
        </h1>

        <div th:if="${#lists.isEmpty(users)}"
             class="alert alert-secondary">
            Користувачів немає
        </div>

        <table th:if="${!#lists.isEmpty(users)}"
               class="table table-hover align-middle">

            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Роль</th>
                <th class="text-center">Деталі</th> </tr>
            </thead>

            <tbody>
            <tr th:each="user : ${users}">

                <td th:text="${user.userID}"></td>

                <td>
                    <a th:href="@{/admin/user/{id}(id=${user.userID})}"
                       th:text="${user.userName}"
                       class="text-decoration-none fw-semibold text-dark">
                    </a>
                </td>

                <td th:text="${user.email}"></td>

                <td>
                    <span th:if="${user.role.name() == 'ADMIN'}"
                          class="badge bg-dark">
                        ADMIN
                    </span>

                    <span th:if="${user.role.name() == 'CLIENT'}"
                          class="badge bg-primary">
                        CLIENT
                    </span>
                </td>

                <td class="text-center">
                    <a th:if="${user.role.name() == 'CLIENT'}"
                       th:href="@{/admin/user/{id}(id=${user.userID})}"
                       class="btn btn-outline-dark btn-sm rounded-2">
                        Абонемент
                    </a>

                    <span th:if="${user.role.name() == 'ADMIN'}" class="text-muted">—</span>
                </td>

            </tr>
            </tbody>

        </table>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
