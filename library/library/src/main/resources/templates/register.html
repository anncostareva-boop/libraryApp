<!DOCTYPE html>
<html lang="uk"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Реєстрація</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">

    <div class="card auth-card p-4">

        <h2 class="text-center mb-4">
            Створення акаунта
        </h2>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">
        </div>

        <div th:if="${passwordNotEqual}"
             class="alert alert-danger"
             th:text="${passwordNotEqual}">
        </div>

        <form th:action="@{/register}"
              th:object="${registerForm}"
              method="post">

            <div class="mb-3">

                <label class="form-label">
                    Ім'я користувача
                </label>

                <input type="text"
                       th:field="*{username}"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Електронна пошта
                </label>

                <input type="email"
                       th:field="*{email}"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Пароль
                </label>

                <input type="password"
                       th:field="*{password}"
                       class="form-control"
                       required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Підтвердіть пароль
                </label>

                <input type="password"
                       th:field="*{confirmPassword}"
                       class="form-control"
                       required>

            </div>

            <button type="submit"
                    class="btn btn-dark w-100">

                Зареєструватися
            </button>

        </form>

        <p class="text-center mt-4 mb-0">

            Вже маєте акаунт?

            <a th:href="@{/login}">
                Увійти
            </a>

        </p>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
