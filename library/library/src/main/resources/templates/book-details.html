<!DOCTYPE html>
<html lang="uk"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Деталі книги</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="row g-5">

        <div class="col-lg-4">

            <div class="text-center p-3 rounded-4 shadow-sm" style="background-color: #f8f9fa;">
                <img th:src="@{/images/books/{id}.jpg(id=${book.bookID})}"
                     class="img-fluid rounded-3"
                     alt="Обкладинка книги"
                     style="max-height: 500px; object-fit: contain; width: 100%;"
                     onerror="this.onerror=null; this.src='/images/books/default.jpg';">
            </div>

        </div>

        <div class="col-lg-8">

            <p class="text-muted">
                ID Книги:
                <span th:text="${book.bookID}"></span>
            </p>

            <h1 class="fw-bold mb-3"
                th:text="${book.title}">
            </h1>

            <h4 class="text-muted mb-4"
                th:text="${book.author}">
            </h4>

            <div class="mb-4">

                <span th:if="${book.status.name() == 'IN_STOCK' || book.status.name() == 'AVAILABLE'}"
                      class="badge bg-success fs-6">
                    Доступна
                </span>

                <span th:if="${book.status.name() != 'IN_STOCK' && book.status.name() != 'AVAILABLE'}"
                      class="badge bg-danger fs-6">
                    Недоступна
                </span>

            </div>

            <div class="card p-4 mb-4">

                <h5 class="mb-3">
                    Опис
                </h5>

                <p class="mb-0"
                   th:text="${book.description}">
                </p>

            </div>

            <div sec:authorize="hasRole('CLIENT')">

                <form th:action="@{/client/request/{id}(id=${book.bookID})}"
                      method="post">

                    <button type="submit"
                            class="btn btn-dark btn-lg">

                        Замовити книгу
                    </button>

                </form>

            </div>

            <div sec:authorize="!isAuthenticated()"
                 class="alert alert-secondary mt-4">

                Будь ласка, <a th:href="@{/login}" class="alert-link text-decoration-underline">увійдіть в акаунт</a>, щоб замовити цю книгу.

            </div>

        </div>

    </div>

    <div sec:authorize="hasRole('ADMIN')"
         class="mt-5">

        <div class="card p-4 shadow-sm border-0">

            <h3 class="mb-4 fw-bold">
                Примірники книги
            </h3>

            <table class="table align-middle">

                <thead>
                <tr>
                    <th>ID примірника</th>
                    <th>Статус</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="copy : ${copies}">

                    <td th:text="${copy.copyID}"></td>

                    <td>
                    <span th:if="${copy.status.name() == 'RESERVED'}"
                          class="badge bg-warning text-dark fs-6">
                        Заброньовано
                    </span>

                        <span th:if="${copy.status.name() == 'DAMAGED'}"
                              class="badge bg-danger fs-6">
                        Пошкоджено
                    </span>

                        <span th:if="${copy.status.name() == 'AVAILABLE' || copy.status.name() == 'IN_STOCK'}"
                              class="badge bg-success fs-6">
                        Доступно
                    </span>

                        <span th:if="${copy.status.name() == 'ISSUED'}"
                              class="badge bg-secondary fs-6">
                        Видано
                    </span>

                        <span th:if="${copy.status.name() != 'RESERVED' && copy.status.name() != 'DAMAGED' && copy.status.name() != 'AVAILABLE' && copy.status.name() != 'IN_STOCK' && copy.status.name() != 'ISSUED'}"
                              th:text="${copy.status}">
                    </span>
                    </td>

                </tr>
                </tbody>

            </table>

        </div>

    </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
