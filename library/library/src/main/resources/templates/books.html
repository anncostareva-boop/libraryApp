<!DOCTYPE html>
<html lang="uk"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Каталог книг</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">

    <h1 class="mb-4">Каталог книг</h1>

    <form th:action="@{/books/search}" method="get" class="row g-3 mb-5">
        <div class="col-md-4">
            <input type="text" name="title" class="form-control" placeholder="Назва">
        </div>
        <div class="col-md-4">
            <input type="text" name="author" class="form-control" placeholder="Автор">
        </div>
        <div class="col-md-3">
            <input type="text" name="genre" class="form-control" placeholder="Жанр">
        </div>
        <div class="col-md-1">
            <button type="submit" class="btn btn-dark w-100">Пошук</button>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(books)}" class="alert alert-info">
        Книги відсутні.
    </div>

    <div class="row g-4">
        <div class="col-md-4" th:each="book : ${books}">
            <div class="card h-100 book-card shadow-sm border-0 rounded-3 overflow-hidden">

                <div class="text-center p-2" style="background-color: #f8f9fa;">
                    <img th:src="@{/images/books/{id}.jpg(id=${book.bookID})}"
                         class="img-fluid"
                         alt="Обкладинка книги"
                         style="height: 340px; object-fit: contain;"
                         onerror="this.onerror=null; this.src='/images/books/default.jpg';">
                </div>

                <div class="card-body d-flex flex-column p-4">
                    <h5 class="card-title fw-bold mb-3" th:text="${book.title}">Назва</h5>

                    <p class="card-text mb-2">
                        <strong>ID:</strong> <span th:text="${book.bookID}"></span>
                    </p>

                    <p class="card-text mb-2">
                        <strong>Автор:</strong> <span th:text="${book.author}"></span>
                    </p>

                    <p class="card-text mb-2">
                        <strong>Жанр:</strong>
                        <span th:text="${book.genre != null && !book.genre.isEmpty() ? book.genre : 'Невідомо'}"></span>
                    </p>

                    <p class="card-text mb-4">
                        <strong>Статус:</strong>
                        <span th:if="${book.status.name() == 'IN_STOCK'}" class="badge bg-success">В наявності</span>
                        <span th:if="${book.status.name() != 'IN_STOCK'}" class="badge bg-secondary">Немає в наявності</span>
                    </p>

                    <a th:href="@{/books/{id}(id=${book.bookID})}" class="btn btn-dark mt-auto w-100 py-2 rounded-2">
                        Детальніше
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
