<!DOCTYPE html>
<html lang="uk"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Онлайн-бібліотека</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
            <form th:action="@{/logout}"
                  method="post">

                <button type="submit"
                        class="btn btn-outline-light btn-sm">
                    Вийти
                </button>

            </form>

        </div>

    </div>

</nav>

<main>

    <section class="hero-section py-5">
        <div class="container">

            <div class="row align-items-center">

                <div class="col-lg-6">

                    <h1 class="hero-title fw-bold">
                        Ласкаво просимо до Онлайн-бібліотеки "Афіна"
                    </h1>

                    <p class="hero-text mt-4 text-muted">
                        Переглядайте книги, керуйте своїми запитами,
                        відстежуйте штрафи та користуйтеся особистим
                        кабінетом цифрової бібліотеки в одному місці.
                    </p>

                    <a th:href="@{/books}"
                       class="btn btn-dark btn-lg mt-3">

                        Переглянути книги
                    </a>

<!--                    <a th:href="@{/task}"-->
<!--                       class="btn btn-dark btn-lg mt-3">-->

<!--                        Переглянути (щось)-->
<!--                    </a>-->

                </div>

                <div class="col-lg-6 text-center">

                    <img src="https://images.unsplash.com/photo-1521587760476-6c12a4b040da?q=80&w=1200"
                         class="img-fluid rounded-4 shadow"
                         alt="Бібліотека">

                </div>

            </div>

        </div>
    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
