<!DOCTYPE html>
<html lang="uk"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Мої штрафи</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="card p-4">

        <h2 class="mb-4">
            Мої штрафи
        </h2>

        <div th:if="${#lists.isEmpty(fines)}"
             class="alert alert-secondary">
            Немає штрафів
        </div>

        <table th:if="${!#lists.isEmpty(fines)}"
               class="table align-middle">

            <thead>
            <tr>
                <th>Причина</th>
                <th>Сума</th>
                <th>Статус</th>
                <th>Дія</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="fine : ${fines}">

                <td>
                    <span th:if="${fine.reason.name() == 'DAMAGE'}">Пошкодження книги</span>
                    <span th:if="${fine.reason.name() == 'OVERDUE'}">Прострочення терміну</span>
                    <span th:if="${fine.reason.name() != 'DAMAGE' && fine.reason.name() != 'OVERDUE'}"
                          th:text="${fine.reason}">
                    </span>
                </td>

                <td th:text="${fine.amount} + ' ₴'"></td>

                <td>

                    <span th:if="${fine.paid}"
                          class="badge bg-success">
                        Оплачено
                    </span>

                    <span th:if="${!fine.paid}"
                          class="badge bg-danger">
                        Неоплачено
                    </span>

                </td>

                <td>

                    <form th:if="${!fine.paid}"
                          th:action="@{/fines/pay/{id}(id=${fine.fineID})}"
                          method="post">

                        <button type="submit"
                                class="btn btn-dark btn-sm">
                            Оплатити
                        </button>

                    </form>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
