<!DOCTYPE html>
<html lang="uk"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Повідомлення</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">

    <div class="card p-4">

        <h1 class="mb-4">
            Повідомлення
        </h1>

        <div th:if="${#lists.isEmpty(notifications)}"
             class="alert alert-secondary">

            Немає повідомлень

        </div>

        <div class="d-flex flex-column gap-3">

            <div th:each="notification : ${notifications}"

                 th:class="${notification.read == true}
                 ? 'card p-4 shadow-sm border-0 bg-light text-muted'
                 : 'card p-4 shadow-sm border border-dark'">

                <div class="d-flex justify-content-between align-items-start">

                    <div>

                        <h5 class="mb-2"
                            th:text="${notification.title}">

                            Назва повідомлення

                        </h5>

                        <p class="mb-2"
                           th:text="${notification.message}">

                            Текст повідомлення

                        </p>

                        <small class="text-muted"
                               th:text="${notification.createdAt}">

                            Дата

                        </small>

                    </div>

                    <div class="text-end">

                        <form th:if="${notification.read != true}"
                              th:action="@{/notifications/read/{id}(id=${notification.notificationID})}"
                              method="post">

                            <button type="submit"
                                    class="btn btn-dark btn-sm">

                                Позначити як прочитане

                            </button>

                        </form>

                        <button th:if="${notification.read == true}"
                                type="button"
                                class="btn btn-light text-muted btn-sm border"
                                disabled>

                            Позначити як прочитане

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
