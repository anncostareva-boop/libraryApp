<!DOCTYPE html>
<html lang="uk"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Профіль адміністратора</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card p-5 shadow-sm border-0 rounded-4 bg-dark text-white mb-4">
                <div class="d-flex align-items-center gap-4">
                    <div class="bg-warning text-dark rounded-circle d-flex align-items-center justify-content-center fw-bold fs-2 shadow"
                         style="width: 70px; height: 70px;">
                        A
                    </div>
                    <div>
                        <h1 class="fw-bold mb-1" th:text="${user.userName}">Адміністратор</h1>
                        <p class="text-warning mb-0 fw-semibold">Профіль адміністратора бібліотеки</p>
                    </div>
                </div>
            </div>

            <div class="card p-4 shadow-sm border-0 rounded-4">

                <h3 class="fw-bold mb-4 text-dark border-bottom pb-2">
                    Особисті дані
                </h3>

                <div class="row g-3 fs-5">
                    <div class="col-sm-4 text-muted fw-medium">Ім'я користувача:</div>
                    <div class="col-sm-8 text-dark fw-semibold th:text='${user.userName}'" th:text="${user.userName}"></div>

                    <div class="col-sm-4 text-muted fw-medium">Електронна пошта:</div>
                    <div class="col-sm-8 text-dark fw-semibold" th:text="${user.email}"></div>
                </div>

                <hr class="my-4">

                <div class="d-flex gap-3">
                    <a th:href="@{/profile/edit}" class="btn btn-outline-dark px-4 py-2 fw-semibold rounded-3">
                        Редагувати дані
                    </a>
                    <a th:href="@{/admin/requests}" class="btn btn-warning px-4 py-2 text-dark fw-bold rounded-3 shadow-sm">
                        Керування запитами
                    </a>
                </div>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
