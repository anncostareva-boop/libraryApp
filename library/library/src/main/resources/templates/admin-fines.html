<!DOCTYPE html>
<html lang="uk"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Штрафи</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">

    <div class="card p-4">

        <h1 class="mb-4">
            Штрафи
        </h1>

        <div th:if="${#lists.isEmpty(fines)}"
             class="alert alert-secondary">

            Штрафів немає

        </div>

        <table th:if="${!#lists.isEmpty(fines)}"
               class="table table-hover align-middle">

            <thead>

            <tr>

                <th>ID</th>

                <th>Користувач</th>

                <th>Сума</th>

                <th>Причина</th>

                <th>Статус</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="fine : ${fines}">

                <td th:text="${fine.fineID}"></td>

                <td>
                    <a th:href="@{/admin/user/{id}(id=${fine.userID})}"
                       th:text="${fine.userID}"
                       class="text-decoration-none fw-semibold text-primary">
                    </a>
                </td>

                <td th:text="${fine.amount + ' грн'}"></td>

                <td>  <span th:if="${fine.reason.name() == 'DAMAGE'}">Пошкодження книги</span>
                    <span th:if="${fine.reason.name() == 'OVERDUE'}">Прострочення терміну</span>
                    <span th:if="${fine.reason.name() != 'DAMAGE' && fine.reason.name() != 'OVERDUE'}"
                          th:text="${fine.reason}">
                    </span></td>

                <td>

                    <span th:if="${fine.paid}"
                          class="badge bg-success">

                        Сплачено

                    </span>

                    <span th:if="${!fine.paid}"
                          class="badge bg-danger">

                        Не сплачено

                    </span>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</main>

</body>
</html>
